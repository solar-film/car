<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขนาดกระจก | CAR CRM</title>
    <link rel="icon" type="image/png" sizes="256x256" href="images/car-crm-app.png?v=20261002-2">
    <link rel="manifest" href="app.webmanifest?v=20261002-2">
    <link rel="apple-touch-icon" href="images/car-crm-app-192.png?v=20261002-2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Design System: DESIGN.html (tokens บน :root, ส่วนหัว Lead, toolbar รายงาน, ปุ่ม Lead, การ์ดรายการติดต่อ, หน้าว่าง/กำลังโหลด) */
        :root {
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-secondary: #475569;
            --color-background: #f8fafc;
            --color-surface: #ffffff;
            --color-text: #1e293b;
            --color-muted: #64748b;
            --color-heading: #0f172a;
            --color-border: #e2e8f0;
            --color-info: #1e40af;
            --color-info-bg: #eff6ff;
            --color-error: #be123c;
            --color-error-bg: #fff1f2;
            --font-family: 'Prompt', sans-serif;
        }
        html { background:var(--color-background); }
        body { font-family:var(--font-family); background:var(--color-background); color:var(--color-text); }
        [hidden] { display:none !important; }
        body.glass-auth-pending #mainHeader, body.glass-auth-pending #mainContent { visibility:hidden; }

        .lead-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; padding:16px 24px; background:var(--color-surface); border-bottom:1px solid var(--color-border); }
        .glass-page-title-row { display:flex; align-items:center; gap:6px; min-width:0; }
        .glass-page-title-row .car-page-heading-title { min-width:0; }
        .glass-add-link { display:inline-flex; align-items:center; justify-content:center; flex:0 0 24px; width:24px; height:24px; border:1px solid #bfdbfe; border-radius:8px; background:var(--color-info-bg); color:var(--color-primary); }
        .glass-add-link:hover { border-color:var(--color-primary); background:#dbeafe; text-decoration:none; }
        .glass-add-link:focus-visible { outline:3px solid #bfdbfe; outline-offset:2px; }
        .glass-add-link svg { width:15px; height:15px; }
        #mainHeader, #mainContent { min-width:0; }
        @media (min-width:1024px) {
            body:not(.car-crm-sidebar-collapsed) #mainHeader, body:not(.car-crm-sidebar-collapsed) #mainContent { margin-left:calc(18rem + 12px); }
            body.car-crm-sidebar-collapsed #mainHeader, body.car-crm-sidebar-collapsed #mainContent { margin-left:0 !important; width:100%; }
            body.car-crm-sidebar-collapsed #mainHeader { padding-left:116px; }
        }
        @media (max-width:1023px) { #mainHeader { padding-left:116px; } }

        .lead-button { display:inline-flex; justify-content:center; align-items:center; gap:6px; border-radius:12px; padding:10px 16px; border:1px solid var(--color-border); background:#fff; font-size:14px; font-weight:600; cursor:pointer; }
        .lead-button:hover { filter:brightness(.97); }
        input, select { border:1px solid #dbe3ef; border-radius:11px; padding:10px 12px; background:#fff; max-width:100%; font:inherit; font-size:14px; }
        input:focus, select:focus, button:focus-visible, summary:focus-visible { outline:3px solid #bfdbfe; outline-offset:2px; }
        .lead-notice { font-size:14px; color:var(--color-info); border-radius:12px; padding:12px 16px; background:var(--color-info-bg); margin-bottom:18px; }
        .lead-notice.error { color:var(--color-error); background:var(--color-error-bg); }
        .lead-empty { text-align:center; padding:40px 12px; color:var(--color-muted); font-size:14px; }

        /* ซ้าย: รายชื่อรุ่นรถ / ขวา: ผังกระจกของรุ่นที่เลือก */
        .glass-layout { display:grid; grid-template-columns:320px minmax(0,1fr); gap:20px; align-items:start; }
        .glass-panel { background:var(--color-surface); border:1px solid var(--color-border); border-radius:18px; box-shadow:0 1px 2px #0000000d; min-width:0; }
        .glass-models { position:sticky; top:16px; display:flex; flex-direction:column; max-height:calc(100vh - 32px); }
        .glass-models-head { padding:16px; border-bottom:1px solid #edf2f7; display:flex; flex-direction:column; gap:10px; }
        .glass-models-title { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .glass-models-title h2 { margin:0; font-size:18px; font-weight:700; color:var(--color-heading); }
        .glass-count { padding:4px 10px; border-radius:999px; background:var(--color-info-bg); color:var(--color-info); font-size:13px; font-weight:700; white-space:nowrap; }
        .glass-filter-row { display:flex; gap:8px; }
        #glass-search { width:100%; height:42px; padding:9px 12px; border:1px solid #dbe5f2; border-radius:12px; font-size:14px; }
        #glass-brand { flex:1; min-width:0; height:42px; padding:9px 12px; border:1px solid #dbe5f2; border-radius:12px; font-size:13px; }
        .glass-refresh { flex:0 0 42px; width:42px; height:42px; padding:0; border-color:#dbe5f2; border-radius:12px; color:var(--color-muted); }
        .glass-refresh:hover { color:var(--color-primary); border-color:#bfdbfe; filter:none; }
        .glass-refresh[aria-busy="true"] svg { animation:save-spin .8s linear infinite; }
        @keyframes save-spin { to { transform:rotate(360deg); } }
        @media (prefers-reduced-motion:reduce) { .glass-refresh[aria-busy="true"] svg { animation:none; } }
        .glass-model-list { overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:2px; }
        .glass-model-item { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; padding:10px 12px; border:1px solid transparent; border-radius:12px; background:none; text-align:left; cursor:pointer; font:inherit; }
        .glass-model-item:hover { background:#f8fafc; }
        .glass-model-item[aria-current="true"] { background:var(--color-info-bg); border-color:#bfdbfe; }
        .glass-model-item strong { display:block; font-size:14px; font-weight:600; color:var(--color-heading); overflow-wrap:anywhere; }
        .glass-model-item[aria-current="true"] strong { color:var(--color-primary); }
        .glass-model-item small { display:block; font-size:12px; color:var(--color-muted); }
        .glass-model-item .glass-jobs { flex-shrink:0; font-size:12px; font-weight:600; color:var(--color-muted); }

        .glass-detail { padding:24px; }
        .glass-back { display:none; margin-bottom:14px; }
        .glass-detail-head { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px 16px; margin-bottom:6px; }
        .glass-detail-head h2 { margin:0; font-size:20px; font-weight:700; color:var(--color-heading); overflow-wrap:anywhere; }
        .glass-detail-head p { margin:2px 0 0; font-size:13px; color:var(--color-muted); }
        .glass-hint { margin:0 0 18px; font-size:12px; color:var(--color-muted); }

        /* ผังกระจกตามตำแหน่งบนตัวรถ: หน้ารถอยู่บน หลังรถอยู่ล่าง */
        .glass-car { max-width:560px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .glass-car-end { grid-column:1 / -1; text-align:center; font-size:11px; font-weight:700; letter-spacing:1px; color:#94a3b8; }
        .glass-pane { display:flex; flex-direction:column; gap:2px; padding:12px 14px; border:1px solid var(--color-border); border-radius:14px; background:var(--color-surface); min-width:0; }
        .glass-pane.wide { grid-column:1 / -1; align-items:center; text-align:center; }
        .glass-pane-label { font-size:12px; font-weight:600; color:var(--color-muted); }
        .glass-pane-size { font-size:24px; line-height:1.3; font-weight:700; color:var(--color-heading); font-variant-numeric:tabular-nums; white-space:nowrap; }
        .glass-pane-meta { font-size:12px; color:var(--color-muted); }
        .glass-pane-other { margin-top:4px; font-size:12px; color:var(--color-secondary); }
        .glass-pane.empty { border-style:dashed; background:#f8fafc; }
        .glass-pane.empty .glass-pane-size { font-size:14px; font-weight:500; color:#94a3b8; }
        .glass-extra-title { grid-column:1 / -1; margin:8px 0 0; font-size:13px; font-weight:700; color:var(--color-heading); }

        .glass-history { margin-top:24px; border-top:1px solid #edf2f7; padding-top:14px; }
        .glass-history > summary { cursor:pointer; color:var(--color-primary); font-size:14px; font-weight:600; padding:4px 0; }
        .glass-table-wrap { overflow-x:auto; margin-top:10px; }
        .glass-table { width:100%; min-width:680px; border-collapse:collapse; font-size:13px; }
        .glass-table th { text-align:left; padding:10px 8px; color:var(--color-muted); font-weight:600; border-bottom:1px solid var(--color-border); white-space:nowrap; }
        .glass-table td { padding:10px 8px; border-bottom:1px solid #edf2f7; vertical-align:top; }
        .glass-table tbody tr:last-child td { border-bottom:0; }
        .glass-table .size { font-weight:700; color:var(--color-heading); white-space:nowrap; }
        .glass-reason-recut { color:var(--color-error); }

        /* มือถือ: แสดงรายชื่อรุ่นก่อน กดเลือกแล้วเปิดผังกระจก มีปุ่มกลับรายการ */
        @media (max-width:1023px) {
            .glass-layout { grid-template-columns:minmax(0,1fr); }
            .glass-models { position:static; max-height:none; }
            .glass-model-list { overflow:visible; }
            .glass-layout:not(.is-detail) .glass-detail { display:none; }
            .glass-layout.is-detail .glass-models { display:none; }
            .glass-back { display:inline-flex; }
            .glass-detail { padding:16px; }
            .glass-pane { padding:10px 12px; }
            .glass-pane-size { font-size:20px; }
        }
    </style>
    <script src="sidebar.js" defer></script>
    <script src="crm-auth.js?v=20261004-lead-1" defer></script>

</head>
<body class="text-slate-800 min-h-screen flex flex-col glass-auth-pending">
    <div data-car-crm-sidebar></div>
    <header id="mainHeader" class="lead-header transition-all duration-300 lg:ml-72">
        <div class="car-page-heading">
            <div class="car-page-heading-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/><path d="M12 13l3-2M12 17l5-3"/></svg></div>
            <div class="car-page-heading-copy">
                <div class="glass-page-title-row">
                    <h1 class="car-page-heading-title">ขนาดกระจก</h1>
                    <a class="glass-add-link" href="add.html" aria-label="เพิ่มรุ่นรถยนต์" title="เพิ่มรุ่นรถยนต์"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
                </div>
                <p class="car-page-heading-subtitle">ขนาดกระจกแต่ละบานที่เคยวัดจากงานติดตั้ง · ชีต data</p>
            </div>

    <main id="mainContent" class="flex-1 p-4 sm:p-6 lg:pl-10 xl:pl-12 transition-all duration-300 lg:ml-72">
        <div id="glass-notice" class="lead-notice" role="status" hidden></div>
        <div id="glass-layout" class="glass-layout">
            <section class="glass-panel glass-models" aria-label="รายชื่อรุ่นรถยนต์">
                <div class="glass-models-head">
                    <div class="glass-models-title"><h2>รุ่นรถยนต์</h2><span id="glass-count" class="glass-count">0 รุ่น</span></div>
                    <input id="glass-search" type="search" placeholder="ค้นหารุ่นรถ ยี่ห้อ หรือ JobID" aria-label="ค้นหารุ่นรถ ยี่ห้อ หรือ JobID" autocomplete="off">
                    <div class="glass-filter-row">
                        <select id="glass-brand" aria-label="กรองยี่ห้อรถยนต์"><option value="">ทุกยี่ห้อ</option></select>
                        <button id="glass-refresh" type="button" class="lead-button glass-refresh" title="โหลดข้อมูลใหม่" aria-label="โหลดข้อมูลใหม่"><svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M5.6 15a7 7 0 0011.8 2.4L20 15M4 9l2.6-2.4A7 7 0 0118.4 9"/></svg></button>
                    </div>

                <div id="glass-model-list" class="glass-model-list">
                    <div class="lead-empty" role="status">กำลังโหลดข้อมูลขนาดกระจก…</div>
                </div>
            </section>
            <section id="glass-detail" class="glass-panel glass-detail" aria-live="polite">
                <div class="lead-empty">เลือกรุ่นรถเพื่อดูขนาดกระจก</div>
            </section>
        </div>
    </main>

    <script>
    (function () {
        'use strict';
        const SHEET_ID = '1u__xYWoWZpmrnquc-Fpk19WtpcrckxSd0-_G35NWxXQ';
        const CAR_MODEL_GID = '1951060658';
        const gviz = params => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&${params}`;
        // data: JobID, ตำแหน่งติดตั้ง, รุ่นฟิล์ม, กว้าง, ยาว, ทีมช่าง, เหตุผลขอตัดฟิล์ม, วันที่ลงรายการ
        const SOURCES = {
            data: gviz('sheet=data&tq=' + encodeURIComponent('select B,C,D,E,F,H,I,K')),
            bookings: gviz('sheet=Bookings&tq=' + encodeURIComponent('select A,G')),
            models: gviz('gid=' + CAR_MODEL_GID)
        };
        // ผังหลัก 8 บาน เรียงตามตัวรถจากหน้าไปหลัง; ตำแหน่งอื่น (ซันรูฟ แครี่บอย) แสดงต่อท้ายเมื่อมีข้อมูล
        const CAR_LAYOUT = [['บานหน้า', 'wide'], ['ประตูหน้า-ซ้าย'], ['ประตูหน้า-ขวา'], ['ประตูหลัง-ซ้าย'], ['ประตูหลัง-ขวา'], ['บานฟิก-ซ้าย'], ['บานฟิก-ขวา'], ['บานหลัง', 'wide']];
        const POSITION_ORDER = CAR_LAYOUT.map(item => item[0]).concat(['ซันรูฟ-ช่อง1', 'ซันรูฟ-ช่อง2', 'ซันรูฟ-ช่อง3', 'แครี่บอย-ซ้าย', 'แครี่บอย-ขวา', 'แครี่บอย-หลัง']);
        const NO_MODEL = 'ไม่พบรุ่นรถในคิวจอง';
        const INVISIBLE = new RegExp('[\\u200B-\\u200F\\u202A-\\u202E\\u2060\\uFEFF]', 'g');
        const mobile = window.matchMedia('(max-width: 1023px)');
        const $ = id => document.getElementById(id);
        const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        // ชื่อรุ่นบางแถวมีอักขระมองไม่เห็นหรือเว้นวรรคเกิน; NFKC ใช้เฉพาะคีย์จัดกลุ่ม เพราะ NFKC แยกสระ "ำ" เป็นสองตัวอักษร
        const clean = value => String(value ?? '').replace(INVISIBLE, '').replace(/\s+/g, ' ').trim();
        const keyOf = value => clean(value).normalize('NFKC').toLowerCase();
        const number = value => { const text = clean(value).replace(/,/g, ''); return /^\d+(\.\d+)?$/.test(text) ? Number(text) : null; };
        const formatNumber = value => Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
        const sizeText = (w, l) => `${formatNumber(w)} × ${formatNumber(l)}`;
        const positionRank = name => { const index = POSITION_ORDER.indexOf(name); return index < 0 ? POSITION_ORDER.length : index; };
        const isNewJobReason = reason => !reason || reason.includes('ลูกค้าใหม่');

        function parseCsv(text) {
            const rows = []; let row = [], cell = '', quoted = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (quoted) {
                    if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; } else cell += c;
                } else if (c === '"') quoted = true;
                else if (c === ',') { row.push(cell); cell = ''; }
                else if (c === '\n') { row.push(cell.replace(/\r$/, '')); rows.push(row); row = []; cell = ''; }
                else cell += c;
            }
            if (cell || row.length) { row.push(cell); rows.push(row); }
            const header = (rows.shift() || []).map(h => clean(h));
            return {header, rows: rows.filter(r => r.some(v => clean(v))).map(r => Object.fromEntries(header.map((h, i) => [h, r[i] ?? ''])))};
        }
        async function readSheet(url, required, label) {
            const response = await fetch(url, {cache: 'no-store', signal: AbortSignal.timeout(30000)});
            if (!response.ok) throw new Error(`โหลดชีต ${label} ไม่สำเร็จ (HTTP ${response.status})`);
            const table = parseCsv(await response.text());
            const missing = required.filter(column => !table.header.includes(column));
            if (missing.length) throw new Error(`หัวคอลัมน์ชีต ${label} ไม่ตรงกับระบบ: ไม่พบ ${missing.join(', ')}`);
            return table.rows;
        }
        // วันที่ลงรายการ: d/m/yyyy (พ.ศ.) HH:MM:SS -> คีย์เรียง yyyy-mm-dd hh:mm:ss (ค.ศ.) และป้ายแสดงผลแบบเดิม
        function parseStamp(value) {
            const text = clean(value);
            const match = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/.exec(text);
            if (!match) return {key: '', label: text || '–'};
            let year = Number(match[3]); if (year > 2400) year -= 543;
            const pad = v => String(v || 0).padStart(2, '0');
            return {key: `${year}-${pad(match[2])}-${pad(match[1])} ${pad(match[4])}:${pad(match[5])}:${pad(match[6])}`, label: `${match[1]}/${match[2]}/${match[3]}`};
        }

        let groups = [], shown = [], selectedKey = null, loading = false;

        function build(dataRows, bookingRows, modelRows) {
            const modelByJob = new Map();
            bookingRows.forEach(row => { const job = clean(row.JobID); if (job && !modelByJob.has(job)) modelByJob.set(job, clean(row['รุ่นรถยนต์'])); });
            const brandByModel = new Map();
            modelRows.forEach(row => { const model = keyOf(row['รุ่นรถยนต์']), brand = clean(row['ยี่ห้อรถยนต์']); if (model && brand && !/^[-–—]+$/.test(brand) && !brandByModel.has(model)) brandByModel.set(model, brand); });
            const byKey = new Map();
            dataRows.forEach(row => {
                const width = number(row['กว้าง']), length = number(row['ยาว']), jobId = clean(row.JobID), position = clean(row['ตำแหน่งติดตั้ง']);
                if (!width || !length || !jobId || !position) return;
                const modelName = modelByJob.get(jobId) || NO_MODEL;
                const key = modelName === NO_MODEL ? '' : keyOf(modelName);
                let group = byKey.get(key);
                if (!group) {
                    group = {key, names: new Map(), brand: key ? brandByModel.get(key) || '' : '', jobs: new Set(), positions: new Map(), records: [], latestKey: '', latestLabel: '–'};
                    byKey.set(key, group);
                }
                group.names.set(modelName, (group.names.get(modelName) || 0) + 1);
                const stamp = parseStamp(row['วันที่ลงรายการ']);
                const record = {jobId, position, width, length, film: clean(row['รุ่นฟิล์ม']), team: clean(row['ทีมช่าง']), reason: clean(row['เหตุผลขอตัดฟิล์ม']), stamp};
                group.records.push(record); group.jobs.add(jobId);
                if (stamp.key > group.latestKey) { group.latestKey = stamp.key; group.latestLabel = stamp.label; }
                let slot = group.positions.get(position);
                if (!slot) group.positions.set(position, slot = {sizes: new Map(), jobs: new Set()});
                slot.jobs.add(jobId);
                // ตัดซ้ำในงานเดิมขนาดเดียวกันนับเป็นงานเดียว จึงไม่ทำให้ขนาดที่ใช้บ่อยเพี้ยน
                const sizeKey = `${width}x${length}`;
                let size = slot.sizes.get(sizeKey);
                if (!size) slot.sizes.set(sizeKey, size = {width, length, jobs: new Set(), latestKey: ''});
                size.jobs.add(jobId);
                if (stamp.key > size.latestKey) size.latestKey = stamp.key;
            });
            groups = [...byKey.values()].map(group => {
                const name = group.key ? [...group.names.entries()].sort((a, b) => b[1] - a[1])[0][0] : NO_MODEL;
                return {...group, name, search: [name, group.brand, ...group.jobs].map(keyOf).join(' ')};
            }).sort((a, b) => (a.key ? 0 : 1) - (b.key ? 0 : 1) || a.name.localeCompare(b.name, 'th'));
        }

        function renderBrands() {
            const select = $('glass-brand'), current = select.value;
            const brands = [...new Set(groups.map(g => g.brand).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
            select.innerHTML = '<option value="">ทุกยี่ห้อ</option>' + brands.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('')
                + (groups.some(g => !g.brand) ? '<option value="__none">ไม่ระบุยี่ห้อ</option>' : '');
            if ([...select.options].some(o => o.value === current)) select.value = current;
        }

        function renderList() {
            const terms = keyOf($('glass-search').value).split(' ').filter(Boolean), brand = $('glass-brand').value;
            shown = groups.filter(g => (!brand || (brand === '__none' ? !g.brand : g.brand === brand)) && terms.every(t => g.search.includes(t)));
            $('glass-count').textContent = `${shown.length.toLocaleString('th-TH')} รุ่น`;
            const list = $('glass-model-list');
            if (!shown.length) {
                list.innerHTML = `<div class="lead-empty">${groups.length ? 'ไม่พบรุ่นรถที่ตรงกับการค้นหา' : 'ยังไม่มีข้อมูลขนาดกระจกในชีต data'}</div>`;
            } else {
                list.innerHTML = shown.map((g, index) => `<button type="button" class="glass-model-item" data-index="${index}" aria-current="${g.key === selectedKey}">`
                    + `<span><strong>${esc(g.name)}</strong><small>${esc(g.brand || 'ไม่ระบุยี่ห้อ')}</small></span><span class="glass-jobs">${g.jobs.size.toLocaleString('th-TH')} งาน</span></button>`).join('');
            }
            // Desktop: เลือกรุ่นแรกให้อัตโนมัติเมื่อรุ่นที่เลือกไว้ไม่อยู่ในผลค้นหา
            if (!mobile.matches && !shown.some(g => g.key === selectedKey)) select(shown[0] ? shown[0].key : null, false);
        }

        function paneHtml(position, slot, wide) {
            if (!slot) return `<div class="glass-pane empty${wide ? ' wide' : ''}"><span class="glass-pane-label">${esc(position)}</span><span class="glass-pane-size">ยังไม่มีข้อมูล</span></div>`;
            const sizes = [...slot.sizes.values()].sort((a, b) => b.jobs.size - a.jobs.size || b.latestKey.localeCompare(a.latestKey));
            const top = sizes[0];
            const others = sizes.slice(1, 3).map(s => `${sizeText(s.width, s.length)} (${s.jobs.size})`).join(' · ') + (sizes.length > 3 ? ` · อีก ${sizes.length - 3} ขนาด` : '');
            return `<div class="glass-pane${wide ? ' wide' : ''}"><span class="glass-pane-label">${esc(position)}</span>`
                + `<span class="glass-pane-size">${esc(sizeText(top.width, top.length))}</span>`
                + `<span class="glass-pane-meta">${slot.jobs.size > 1 ? `ใช้ขนาดนี้ ${top.jobs.size} จาก ${slot.jobs.size} งาน` : 'วัด 1 งาน'}</span>`
                + (others ? `<span class="glass-pane-other">ขนาดอื่น: ${esc(others)}</span>` : '') + '</div>';
        }

        function renderDetail() {
            const box = $('glass-detail'), group = groups.find(g => g.key === selectedKey);
            $('glass-layout').classList.toggle('is-detail', !!group);
            if (!group) { box.innerHTML = `<div class="lead-empty">${shown.length ? 'เลือกรุ่นรถเพื่อดูขนาดกระจก' : 'ไม่มีรุ่นรถให้แสดง'}</div>`; return; }
            const main = CAR_LAYOUT.map(([position, wide]) => paneHtml(position, group.positions.get(position), wide)).join('');
            const extras = [...group.positions.keys()].filter(p => !CAR_LAYOUT.some(([name]) => name === p)).sort((a, b) => positionRank(a) - positionRank(b) || a.localeCompare(b, 'th'));
            const history = group.records.slice().sort((a, b) => b.stamp.key.localeCompare(a.stamp.key) || a.jobId.localeCompare(b.jobId) || positionRank(a.position) - positionRank(b.position)).map(r =>
                `<tr><td>${esc(r.stamp.label)}</td><td>${esc(r.jobId)}</td><td>${esc(r.position)}</td><td class="size">${esc(sizeText(r.width, r.length))}</td>`
                + `<td>${esc(r.film || '–')}</td><td>${esc(r.team || '–')}</td><td class="${isNewJobReason(r.reason) ? '' : 'glass-reason-recut'}">${esc(r.reason || '–')}</td></tr>`).join('');
            box.innerHTML = '<button type="button" class="lead-button glass-back" data-back><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg> รายชื่อรุ่นรถ</button>'
                + `<div class="glass-detail-head"><div><h2>${esc(group.name)}</h2><p>${esc(group.brand || 'ไม่ระบุยี่ห้อ')} · วัดแล้ว ${group.jobs.size.toLocaleString('th-TH')} งาน · ล่าสุด ${esc(group.latestLabel)}</p></div></div>`
                + '<p class="glass-hint">ตัวเลขใหญ่ = ขนาดที่ใช้บ่อยที่สุด (กว้าง × ยาว)</p>'
                + `<div class="glass-car"><div class="glass-car-end">ด้านหน้ารถ</div>${main}<div class="glass-car-end">ด้านหลังรถ</div>`
                + (extras.length ? '<p class="glass-extra-title">ตำแหน่งอื่น</p>' + extras.map(p => paneHtml(p, group.positions.get(p), false)).join('') : '') + '</div>'
                + `<details class="glass-history"><summary>ประวัติการวัดทั้งหมด (${group.records.length.toLocaleString('th-TH')} รายการ)</summary><div class="glass-table-wrap"><table class="glass-table"><thead><tr><th>วันที่ลงรายการ</th><th>JobID</th><th>ตำแหน่ง</th><th>กว้าง × ยาว</th><th>รุ่นฟิล์ม</th><th>ทีมช่าง</th><th>เหตุผล</th></tr></thead><tbody>${history}</tbody></table></div></details>`;
        }

        function select(key, scroll = true) {
            selectedKey = key;
            $('glass-model-list').querySelectorAll('.glass-model-item').forEach(item => item.setAttribute('aria-current', String(shown[item.dataset.index]?.key === key)));
            renderDetail();
            if (scroll && mobile.matches) window.scrollTo({top: 0});
        }

        function notice(text, error = false) {
            const box = $('glass-notice');
            box.hidden = !text; box.textContent = text || ''; box.classList.toggle('error', error);
        }

        async function load() {
            if (loading) return;
            loading = true;
            const button = $('glass-refresh');
            button.setAttribute('aria-busy', 'true'); button.disabled = true;
            if (groups.length) notice('กำลังโหลดข้อมูลล่าสุด…');
            try {
                const [dataRows, bookingRows, modelRows] = await Promise.all([
                    readSheet(SOURCES.data, ['JobID', 'ตำแหน่งติดตั้ง', 'กว้าง', 'ยาว'], 'data'),
                    readSheet(SOURCES.bookings, ['JobID', 'รุ่นรถยนต์'], 'Bookings'),
                    readSheet(SOURCES.models, ['ยี่ห้อรถยนต์', 'รุ่นรถยนต์'], 'Car_model')
                ]);
                build(dataRows, bookingRows, modelRows);
                renderBrands(); renderList(); renderDetail(); notice('');
            } catch (error) {
                // แหล่งข้อมูลล้มเหลว: แสดงข้อผิดพลาดและคงรายการเดิมไว้ ไม่แสดงเป็นศูนย์รายการ
                notice((error && error.name === 'TimeoutError' ? 'โหลดข้อมูลนานเกินไป กรุณากดโหลดใหม่' : error.message) || 'โหลดข้อมูลไม่สำเร็จ', true);
                if (!groups.length) $('glass-model-list').innerHTML = '<div class="lead-empty">โหลดข้อมูลขนาดกระจกไม่สำเร็จ</div>';
            } finally {
                loading = false; button.removeAttribute('aria-busy'); button.disabled = false;
            }
        }

        function start() {
            document.body.classList.remove('glass-auth-pending');
            let timer = 0;
            $('glass-search').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(renderList, 150); });
            $('glass-brand').addEventListener('change', renderList);
            $('glass-refresh').addEventListener('click', load);
            $('glass-model-list').addEventListener('click', event => {
                const item = event.target.closest('.glass-model-item');
                if (item && shown[item.dataset.index]) select(shown[item.dataset.index].key);
            });
            $('glass-detail').addEventListener('click', event => { if (event.target.closest('[data-back]')) select(null); });
            load();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const auth = window.CarCrmAuth;
            const signedIn = auth ? await auth.refresh() : false;
            if (!signedIn) { location.replace('crm-login.html?next=' + encodeURIComponent('glass-size.html')); return; }
            start();
        });
    })();
    </script>
</body>
</html>
